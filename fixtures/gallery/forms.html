<!doctype html><meta charset="utf-8"><title>Forms</title>
<style>body{margin:0;padding:20px 28px;font:16px/1.5 system-ui,sans-serif;max-width:640px}label{display:block;margin:10px 0 2px;font-weight:600}input,select,textarea,button{font:inherit;padding:6px 8px;border:1px solid #9ca3af;border-radius:6px}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;box-sizing:border-box}.row{display:flex;gap:16px}fieldset{border:1px solid #d1d5db;border-radius:8px;margin:14px 0}button.p{background:#2563eb;color:#fff;border-color:#2563eb}</style>
<h1>Sign up</h1><form onsubmit="event.preventDefault();document.getElementById('out').textContent='submitted: '+new FormData(event.target).get('name')">
<label>Name</label><input type="text" name="name" placeholder="Your name"><label>Email</label><input type="email" placeholder="you@example.com">
<label>Password</label><input type="password" value="hunter2"><div class="row"><div style="flex:1"><label>Country</label><select><option>Austria</option><option selected>Germany</option><option>Japan</option></select></div>
<div style="flex:1"><label>Age</label><input type="number" value="30" min="0"></div></div>
<label>Bio</label><textarea rows="4">Hello
second line</textarea>
<fieldset><legend>Plan</legend><label style="font-weight:400"><input type="radio" name="p" checked> Free</label><label style="font-weight:400"><input type="radio" name="p"> Pro</label><label style="font-weight:400"><input type="checkbox" checked> Subscribe to news</label><label style="font-weight:400"><input type="checkbox"> Accept terms</label></fieldset>
<label>Volume</label><input type="range" value="40"> <input type="color" value="#ff8800"> <input type="date" value="2026-10-08">
<p><button class="p" type="submit">Create account</button> <button type="reset">Reset</button> <button type="button" disabled>Disabled</button></p><p id="out">–</p></form>
