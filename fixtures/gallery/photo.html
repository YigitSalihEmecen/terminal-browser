<!doctype html><meta charset="utf-8"><title>Images</title>
<style>body{margin:0;padding:20px;font:16px/1.5 system-ui,sans-serif;max-width:820px}img{display:block}figure{margin:16px 0}figcaption{color:#57606a;font-size:13px}
.row{display:flex;gap:16px;align-items:center}.thumb{width:160px;height:90px;object-fit:cover;border-radius:8px}</style>
<h1>Images</h1>
<figure><img src="photo.jpg" width="640" height="360" alt="Synthetic landscape"><figcaption>A 640×360 photo-like image with gradients and noise.</figcaption></figure>
<div class="row"><img src="icon.png" width="96" height="96" alt="icon"><img src="logo.svg" width="240" height="80" alt="logo"><a href="#"><img class="thumb" src="photo.jpg" alt="thumb link"></a></div>
<p>An inline image <img src="icon.png" width="20" height="20" style="display:inline;vertical-align:middle" alt=""> sits in a line of text, followed by more text.</p>
<p style="display:flex;gap:8px"><img class="thumb" src="photo.jpg" alt=""><img class="thumb" src="photo.jpg" style="filter:grayscale(1)" alt=""><img class="thumb" src="photo.jpg" style="filter:blur(3px)" alt=""></p>
<div style="width:300px;height:120px;background:url(photo.jpg) center/cover;border-radius:12px;color:#fff;display:flex;align-items:flex-end;padding:10px;font-weight:700;text-shadow:0 1px 3px #000">CSS background image</div>
