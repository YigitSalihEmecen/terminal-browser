<!doctype html><meta charset="utf-8"><title>Ticker</title>
<style>body{font:16px/24px sans-serif;max-width:720px;margin:16px auto}
#spin{display:inline-block;width:24px;height:24px;border:4px solid #08c;border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}</style>
<h1>Ticker</h1><p>BENCH-READY</p>
<p>Counter: <b id="n">0</b> <span id="spin"></span></p>
<p>A page with a counter that changes five times a second plus a CSS spinner, the kind of
activity (clock, progress bar, live feed) that keeps a remote browser busy.</p>
<script>let n=0;setInterval(()=>{document.getElementById('n').textContent=++n},200)</script>
