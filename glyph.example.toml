# glyph configuration — copy to ~/.config/glyph/config.toml ($XDG_CONFIG_HOME/glyph/config.toml)
# Every key is optional; what you leave out keeps the default shown here.
# Unknown keys are an error (so typos do not silently do nothing).

[ui]
# Lines moved by j / k / arrow keys, and per mouse-wheel notch.
scroll_lines = 2
wheel_lines = 3
# Omnibox text that is not a URL becomes a search. %s is the URL-encoded query.
search = "https://duckduckgo.com/?q=%s"
# Letters used for link hints (f / F / gi), home row first.
hint_chars = "asdfghjklqwertyuiopzxcvbnm"
# "auto" | "truecolor" | "256" | "16". auto reads $COLORTERM / $TERM.
color = "auto"
# What pages see for prefers-color-scheme: "auto" (follow $COLORFGBG, else light) | "light" | "dark".
color_scheme = "auto"
# Capture the mouse (click, wheel, drag-to-copy). Turn off to use your terminal's own selection.
mouse = true
# Opened by the "new-tab" action (ctrl-t). "about:blank" opens an empty tab.
home = "about:blank"

[images]
# "auto" picks Kitty / iTerm2 / Sixel from the environment (never inside tmux);
# or force "kitty" | "iterm2" | "sixel" | "none". Without a protocol, images are shown as half-blocks.
protocol = "auto"
# The server's `lean` profile blocks images unless the client can show them.
# true: load them anyway and show half-blocks (costs bandwidth).
always_load = false

[theme]
# "dark" | "light" | "high-contrast". Any colour below overrides the preset.
preset = "dark"
