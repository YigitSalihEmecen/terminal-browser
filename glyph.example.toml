# Key bindings. "spec" = "action". Press ? in the browser for the full, current list.
# Spec syntax: plain characters are keys ("gg" = g then g); <c-d> ctrl-d, <a-x> alt-x, <s-tab>,
# <esc>, <cr>, <space>, <up>, <f5>, <lt> for "<". Use "none" to unbind.
# Actions: scroll-down scroll-up scroll-left scroll-right half-page-down half-page-up page-down
# page-up scroll-top scroll-bottom back forward reload stop omnibox omnibox-current
# omnibox-new-tab new-tab close-tab next-tab prev-tab first-tab last-tab tab-1 … tab-9 hints
# hints-new-tab hints-input find find-next find-prev insert visual copy-url copy-title
# toggle-text-mode help redraw escape quit

[keys.normal]
# "j" = "scroll-down"
# "<c-n>" = "scroll-down"
# "d" = "close-tab"
# "x" = "none"

[keys.insert]
# keys that still work while typing into a page field (everything else goes to the page)
